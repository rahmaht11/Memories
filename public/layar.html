<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dinding Kenangan Anjangsana</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--ink:#3B2342;--purple:#6A4FC9;--purple-dk:#4A2F9E;--pink:#FF5FA2;--yellow:#FFE66D;--blue:#9BE8FF;--screen1:#D2EBFF;--screen2:#E0D2FF;--muted:#6F5A86}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;color:var(--ink);font:17px/1.5 Nunito,system-ui,sans-serif;
  background:radial-gradient(circle at 18% 8%,rgba(255,255,255,.6),transparent 38%),radial-gradient(circle,rgba(255,255,255,.35) 2px,transparent 2.6px) 0 0/16px 16px,linear-gradient(160deg,#FF7EBB,#FFB3D9 55%,#FF8CC6) fixed}
.pix{font-family:"Pixelify Sans",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.02em}
.ol{text-shadow:-3px 0 var(--purple),3px 0 var(--purple),0 -3px var(--purple),0 3px var(--purple),-3px -3px var(--purple),3px -3px var(--purple),-3px 3px var(--purple),3px 3px var(--purple),0 6px 0 var(--purple-dk),3px 6px 0 var(--purple-dk),-3px 6px 0 var(--purple-dk)}
.ol-s{text-shadow:-2px 0 var(--purple),2px 0 var(--purple),0 -2px var(--purple),0 2px var(--purple),-2px -2px var(--purple),2px -2px var(--purple),-2px 2px var(--purple),2px 2px var(--purple),0 4px 0 var(--purple-dk)}
.brand{display:flex;flex-direction:column;gap:2px;line-height:1}
.brand .k{color:#fff;font-size:clamp(14px,1.9vw,26px);font-weight:700}
.brand .t{display:flex;flex-wrap:wrap;align-items:baseline;gap:.25em .3em;font-weight:700;font-size:clamp(30px,5.2vw,72px)}
.brand .a{color:#FFF27A}.brand .x{color:#fff;font-size:.6em}.brand .r{color:var(--blue)}
.brand .v{font-size:.34em;color:var(--purple-dk);background:#fff;border:3px solid var(--purple);border-radius:999px;padding:.15em .6em;text-shadow:none;align-self:center;transform:rotate(-4deg)}
.stk{position:absolute;pointer-events:none;width:var(--s,40px);transform:rotate(var(--r,0deg));
 filter:drop-shadow(1.5px 0 0 #3B2342) drop-shadow(-1.5px 0 0 #3B2342) drop-shadow(0 1.5px 0 #3B2342) drop-shadow(0 -1.5px 0 #3B2342) drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(0 6px 4px rgba(59,35,66,.3))}
.stk .px,.ico .px{display:block;width:100%;height:auto}
.ico{filter:drop-shadow(2px 0 0 #3B2342) drop-shadow(-2px 0 0 #3B2342) drop-shadow(0 2px 0 #3B2342) drop-shadow(0 -2px 0 #3B2342)}
@media (prefers-reduced-motion:no-preference){.bob{animation:bob 2.8s ease-in-out infinite}.bob2{animation:bob 3.4s -1s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px) rotate(calc(var(--r,0deg) + 6deg))}}}
button{font:inherit;font-family:"Pixelify Sans",sans-serif;font-weight:600;border-radius:12px;border:3px solid var(--purple-dk);background:var(--yellow);color:var(--ink);padding:8px 16px;cursor:pointer;box-shadow:0 4px 0 var(--purple-dk);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--purple-dk)}
:focus-visible{outline:3px solid #fff;outline-offset:3px;box-shadow:0 0 0 6px var(--purple)}

html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:18px;padding:14px 30px 10px;flex:0 0 auto;flex-wrap:wrap;position:relative;z-index:2}
.brand{flex:1 1 360px}
.brand .t{font-size:clamp(26px,3.7vw,54px)}
.count{font-family:"Pixelify Sans",sans-serif;font-weight:700;background:var(--yellow);border:3px solid var(--purple-dk);border-radius:12px;padding:4px 14px;font-size:clamp(16px,1.8vw,24px);font-variant-numeric:tabular-nums;box-shadow:0 4px 0 var(--purple-dk);text-transform:uppercase}
.count:empty{display:none}
.tools{display:flex;gap:10px;flex-wrap:wrap;transition:opacity .3s}
:fullscreen .tools{opacity:0}
:fullscreen .tools:hover,:fullscreen .tools:focus-within{opacity:1}
button[aria-pressed=true]{background:#8DF0CE}
button.qr{display:flex;align-items:center;gap:10px;background:#fff;padding:6px 14px 6px 6px;text-align:left;font-size:14px;line-height:1.25;text-transform:uppercase;border-radius:16px;box-shadow:0 4px 0 var(--purple-dk),0 0 0 3px #fff}
.qr #qrbox{width:70px;height:70px;flex:0 0 auto}
.qr #qrbox img,.qr #qrbox canvas{width:70px!important;height:70px!important;display:block}
.qr small{display:block;font-family:Nunito,sans-serif;text-transform:none;font-weight:700;color:var(--purple);font-size:12px}
.wrap{position:relative;flex:1 1 auto;min-height:0;margin:8px 34px 8px;z-index:1}
.screen{height:100%;overflow-y:auto;background:linear-gradient(160deg,var(--screen1),var(--screen2));border:4px solid var(--purple);border-radius:26px;box-shadow:0 0 0 4px #fff,0 0 0 8px var(--pink);padding:28px 26px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:26px 22px}
.card{all:unset;box-sizing:border-box;cursor:pointer;position:relative;background:var(--c);border:3px solid var(--purple-dk);border-radius:20px;box-shadow:5px 5px 0 var(--a);display:flex;flex-direction:column;min-width:0;transition:transform .15s}
.card:nth-child(odd){transform:rotate(-1.2deg)}.card:nth-child(even){transform:rotate(1deg)}
.card:hover,.card:focus-visible{transform:rotate(0) scale(1.04);z-index:2}
.card:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.card.new{animation:pop .9s cubic-bezier(.3,1.6,.5,1) both}
.ph{aspect-ratio:4/3;background:#fff;display:grid;place-items:center;margin:10px 10px 0;border:3px solid #fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 0 rgba(59,35,66,.25)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.noimg{background:repeating-linear-gradient(45deg,rgba(255,255,255,.75) 0 10px,rgba(255,255,255,.45) 10px 20px)}
.ph .ico{width:34%}
.tx{padding:10px 16px 16px}
.from{font-family:"Pixelify Sans",sans-serif;font-weight:700;font-size:18px;overflow-wrap:anywhere}
.pv{opacity:.85;font-weight:600;font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.card .stk{right:-12px;top:-16px;--s:34px;--r:12deg}
.empty{background:rgba(255,255,255,.8);border:3px dashed var(--purple);border-radius:24px;padding:60px 20px;text-align:center;color:var(--muted);font-size:20px;font-weight:800}
.empty strong{display:block;color:var(--purple-dk);font-family:"Pixelify Sans",sans-serif;text-transform:uppercase;font-size:30px;margin-bottom:8px}
@keyframes pop{from{transform:scale(.7) rotate(-6deg);opacity:0}to{opacity:1}}
.foot{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:14px;padding:6px 30px 12px;color:#fff;font-weight:800;font-size:14px;text-align:center;text-shadow:0 2px 0 var(--purple);position:relative;z-index:2}
.foot b{font-family:"Pixelify Sans",sans-serif;text-transform:uppercase;font-size:18px;letter-spacing:.06em}
.dots{display:flex;gap:6px}.dots i{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--purple-dk);display:block}
/* overlay surat */
#ov{position:fixed;inset:0;background:rgba(74,47,158,.88);display:none;align-items:center;justify-content:center;padding:3vmin;z-index:10;overflow:hidden}
#ov.on{display:flex}
.stage{width:min(1400px,100%);max-height:100%;display:flex;flex-direction:column;align-items:center;gap:1.4vmin}
.env{width:min(22vmin,200px);cursor:pointer;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.env .flap{transform-origin:50% 22%;animation:flap .8s .25s ease both}
@keyframes flap{to{transform:rotateX(180deg)}}
.letter{position:relative;background:linear-gradient(160deg,var(--screen1),var(--screen2));color:var(--ink);border-radius:30px;border:.8vmin solid var(--purple);box-shadow:0 0 0 .7vmin #fff,0 0 0 1.4vmin var(--pink);width:min(94%,1300px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:3vmin;padding:3.5vmin;align-items:center;animation:rise .7s 1s cubic-bezier(.3,1.4,.5,1) both;margin-top:1vmin}
.letter.nopic{grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr)}
.letter .pic{border-radius:16px;border:1vmin solid #fff;box-shadow:0 .6vmin 0 rgba(59,35,66,.3);background:#fff;transform:rotate(-1.5deg);overflow:hidden}
.letter .pic img{width:100%;max-height:60vh;object-fit:contain;display:block}
.letter .pic.icon{background:var(--c);aspect-ratio:1/1;display:grid;place-items:center;max-height:44vh;margin:0 auto;width:100%}
.letter .pic.icon .ico{width:52%}
.rt{max-height:58vh;overflow:hidden;min-width:0}
.letter .who{display:inline-block;font-family:"Pixelify Sans",sans-serif;text-transform:uppercase;font-weight:700;font-size:clamp(24px,4.2vmin,54px);margin-bottom:1.8vmin;background:var(--pink);color:#fff;border:.5vmin solid var(--purple-dk);border-radius:1.4vmin;padding:.15em .7em;text-shadow:0 .3vmin 0 var(--purple-dk);box-shadow:0 .6vmin 0 var(--purple-dk)}
.letter .msg{font-size:clamp(20px,3.7vmin,48px);line-height:1.5;font-weight:700;white-space:pre-wrap;overflow-wrap:anywhere}
.letter .stk{--s:7.5vmin}
.ovtools{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:12px;display:flex;gap:8px;z-index:11}
.pin{background:#fff;border:3px solid var(--purple-dk);border-radius:14px;padding:8px;display:flex;gap:6px;align-items:center}
.pin input{font:inherit;width:110px;padding:6px 10px;border-radius:10px;border:2px solid var(--purple)}
@keyframes rise{from{opacity:0;transform:translateY(5vmin) scale(.96)}to{opacity:1;transform:none}}
@media (max-width:820px){.letter,.letter.nopic{grid-template-columns:minmax(0,1fr)}.wrap{margin:8px 14px}header{padding:12px 16px 8px}}
@media (prefers-reduced-motion:reduce){.env .flap,.letter,.card.new{animation:none}.env .flap{transform:rotateX(180deg)}}
/* QR besar */
#qrOv{position:fixed;inset:0;background:rgba(74,47,158,.9);display:none;align-items:center;justify-content:center;z-index:15;padding:3vmin;cursor:zoom-out}
#qrOv.on{display:flex}
.qrbig{background:#fff;border:.9vmin solid var(--purple);border-radius:30px;box-shadow:0 0 0 .8vmin #fff,0 0 0 1.6vmin var(--pink);padding:3.5vmin;text-align:center;display:grid;gap:2vmin;justify-items:center;position:relative}
.qrbig h2{margin:0;font-size:clamp(20px,4vmin,44px);color:var(--purple-dk)}
#qrBigBox{line-height:0}
#qrBigBox img,#qrBigBox canvas{display:block}
.qrbig .url{font-weight:800;color:var(--muted);font-size:clamp(14px,2.4vmin,26px);overflow-wrap:anywhere}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:30;display:none;font-weight:800}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20}
</style>
</head>
<body>
<header>
  <div class="brand pix" id="brand"></div>
  <button class="qr pix" id="qr" aria-label="Perbesar kode QR" hidden><span id="qrbox"></span><span><span id="qrText"></span><small id="qrHint"></small></span></button>
  <div class="count" id="count" aria-live="polite"></div>
  <div class="tools">
    <button id="bAuto" aria-pressed="false"></button>
    <button id="bFull"></button>
    <button id="bAlbum"></button>
  </div>
</header>
<div class="wrap">
  <div class="stk bob" style="--s:44px;--r:-14deg;left:-24px;top:-22px;z-index:3" id="c1"></div>
  <div class="stk bob2" style="--s:40px;--r:12deg;right:-22px;top:-20px;z-index:3" id="c2"></div>
  <div class="stk bob2" style="--s:36px;--r:-8deg;left:-22px;bottom:-14px;z-index:3" id="c3"></div>
  <div class="stk bob" style="--s:42px;--r:10deg;right:-22px;bottom:-16px;z-index:3" id="c4"></div>
  <div class="screen"><div class="grid" id="grid"></div></div>
</div>
<footer class="foot"><div class="dots" aria-hidden="true"><i style="background:#FF5FA2"></i><i style="background:#9BA8FF"></i><i style="background:#FFD84D"></i></div><span><b id="tema"></b> <span id="temaIsi"></span></span><div class="dots" aria-hidden="true"><i style="background:#8DF0CE"></i><i style="background:#FFA24D"></i><i style="background:#FF5FA2"></i></div></footer>
<div id="ov" role="dialog" aria-modal="true" aria-label="Kesan dan pesan"></div>
<div id="qrOv" role="dialog" aria-modal="true" aria-label="Kode QR"><div class="qrbig"><h2 class="pix" id="qrBigTitle"></h2><div id="qrBigBox"></div><div class="url" id="qrUrl"></div></div></div>
<canvas id="fx"></canvas>
<div id="toast" role="status"></div>
<script>
/* ===================== TEKS: ubah di sini ===================== */
var TEKS={
  judul1:"Anjangsana",judul2:"Rotasi",versi:"2.0",
  sub:"Kesan & Pesan",
  tema:"Resonance",
  temaIsi:"Reflecting Experiences, Sharing Organizational Narratives, and Advancing Collaborative Engagement",
  qr:"Scan yuk!",qrHint:"Klik untuk perbesar",qrJudul:"Scan untuk kirim kesan & pesan",
  kosongJudul:"Menunggu pesan pertama...",
  kosongIsi:"Scan kode QR di pojok atas untuk mengirim.",
  auto:"Putar otomatis",penuh:"Layar penuh",album:"Unduh album",
  satuan:"kenangan"
};
/* ================================================================ */
/* ---------- ikon pixel (dipakai sebagai ikon pesan tanpa foto dan stiker) ---------- */
var PX={
 heart:[".pp.pp.","pwppppp","ppppppp",".ppppp.","..ppp..","...p..."],
 star:["....y....","....y....","...yyy...","yyyyyyyyy",".yyyYyyy.","..yyyyy..","..yyyyy..",".yyy.yyy.",".yy...yy."],
 smiley:["..yyyyy..",".yyyyyyy.","yyyyyyyyy","yykyyykyy","yykyyykyy","ypyyyyypy","yykyyykyy",".yykkkyy.","..yyyyy.."],
 cat:["l.......l","lll...lll","lllllllll","llklllkll","lllllllll","lpllpllpl",".lllllll.","..lllll.."],
 ghost:["..wwww..",".wwwwww.","wwwwwwww","wwkwwkww","wwkwwkww","wPwwwwPw","wwwwwwww","wwwwwwww","ww.ww.ww"],
 flower:["..ppp..",".ppppp.","pppyppp",".ppppp.","..ppp..","...g...","..ggg..","...g..."],
 coin:[".yyyyy.","yyYYyyy","yYyooyy","yYyooyy","yyyooyy","yyyyyyy",".yyyyy."],
 cloud:["..BBB....",".BBBBBBB.","BBkBBBkBB","BpBBBBBpB",".BBBBBBB."],
 plusP:["..p..","..p..","ppppp","..p..","..p.."],
 plusY:["..y..","..y..","yyyyy","..y..","..y.."],
 plusB:["..b..","..b..","bbbbb","..b..","..b.."],
 plusL:["..l..","..l..","lllll","..l..","..l.."]
};
var PXC={p:"#FF5FA2",P:"#FFB3D1",y:"#FFD84D",Y:"#FFF4B8",o:"#FFA24D",b:"#5DB8FF",B:"#D4ECFF",l:"#A98BFF",w:"#FFFFFF",k:"#3B2342",g:"#4CD38A"};
function px(n){var g=PX[n],h=g.length,w=g[0].length,s="";
  for(var y=0;y<h;y++)for(var x=0;x<w;x++){var c=g[y].charAt(x);if(c!==".")s+='<rect x="'+x+'" y="'+y+'" width="1.02" height="1.02" fill="'+PXC[c]+'"/>'}
  return '<svg class="px" viewBox="-.5 -.5 '+(w+1)+' '+(h+1)+'" shape-rendering="crispEdges" aria-hidden="true">'+s+'</svg>'}
var ICONS=["heart","cat","star","smiley","ghost","flower","coin","cloud"];
var STK=["heart","star","plusP","smiley","plusY","cat","coin","plusB","flower","ghost","plusL","cloud"];

(function(){
  var $=function(i){return document.getElementById(i)};
  var HOLD=14000, entries=[], known={}, afterKey="", first=true, queue=[], showing=false, timer=null, autoIdx=0, auto=false;
  var PAL=[["#FFD9EA","#FF5FA2"],["#FFF4B8","#F5B700"],["#D3F6E9","#12B886"],["#D4ECFF","#3D9BFF"],["#E6DBFF","#8B5CF6"]];
  function idx(e){return entries.findIndex(function(x){return x.id===e.id})}
  function pal(e){return PAL[Math.max(idx(e),0)%PAL.length]}
  function icon(e){return ICONS[Math.max(idx(e),0)%ICONS.length]}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function toast(t){var e=$("toast");e.textContent=t;e.style.display="block";setTimeout(function(){e.style.display="none"},3000)}
  function photo(e){return e.hasPhoto?"/api/foto?id="+encodeURIComponent(e.id):""}

  document.title=TEKS.judul1+" x "+TEKS.judul2+" "+TEKS.versi;
  $("brand").innerHTML='<div class="k ol-s">'+esc(TEKS.sub)+'</div><div class="t ol"><span class="a">'+esc(TEKS.judul1)+'</span><span class="x">x</span><span class="r">'+esc(TEKS.judul2)+'</span><span class="v">'+esc(TEKS.versi)+'</span></div>';
  $("qrText").textContent=TEKS.qr;$("qrHint").textContent=TEKS.qrHint;$("qrBigTitle").textContent=TEKS.qrJudul;
  $("bAuto").textContent=TEKS.auto;$("bFull").textContent=TEKS.penuh;$("bAlbum").textContent=TEKS.album;
  $("tema").textContent=TEKS.tema;$("temaIsi").textContent=TEKS.temaIsi;
  [["c1","heart"],["c2","star"],["c3","plusY"],["c4","smiley"]].forEach(function(a){$(a[0]).innerHTML=px(a[1])});
  try{auto=localStorage.getItem("auto")==="1"}catch(x){}
  $("bAuto").setAttribute("aria-pressed",auto);

  var envSvg='<svg class="env" viewBox="0 0 120 100" fill="none" aria-hidden="true"><rect x="10" y="30" width="100" height="62" rx="8" fill="#FFD9EA" stroke="#4A2F9E" stroke-width="4"/><path d="M60 66c-14-12-24-18-24-28 0-7 6-11 12-11 5 0 10 3 12 8 2-5 7-8 12-8 6 0 12 4 12 11 0 10-10 16-24 28z" fill="#FF5FA2" stroke="#4A2F9E" stroke-width="3"/><path d="M10 38l50 34 50-34" stroke="#4A2F9E" stroke-width="4" stroke-linejoin="round"/><path class="flap" d="M10 30L60 6l50 24" stroke="#4A2F9E" stroke-width="4" stroke-linejoin="round" fill="#FFE66D"/></svg>';

  function render(){
    $("count").textContent=entries.length?entries.length+" "+TEKS.satuan:"";
    var g=$("grid");
    if(!entries.length){g.innerHTML='<div class="empty" style="grid-column:1/-1"><strong>'+esc(TEKS.kosongJudul)+'</strong>'+esc(TEKS.kosongIsi)+'</div>';return}
    g.innerHTML=entries.map(function(e,i){return {e:e,i:i}}).reverse().map(function(o){
      var e=o.e,p=photo(e),c=PAL[o.i%PAL.length],ic=ICONS[o.i%ICONS.length],sk=STK[(o.i*5+2)%STK.length];
      return '<button class="card'+(e._new?' new':'')+'" style="--c:'+c[0]+';--a:'+c[1]+'" data-id="'+esc(e.id)+'" aria-label="Buka pesan dari '+esc(e.name)+'">'+
        '<span class="stk">'+px(sk)+'</span><div class="ph'+(p?'':' noimg')+'">'+
        (p?'<img loading="lazy" alt="" src="'+p+'">':'<div class="ico">'+px(ic)+'</div>')+
        '</div><div class="tx"><div class="from">Dari '+esc(e.name)+'</div><div class="pv">'+esc(e.message)+'</div></div></button>';
    }).join("");
    entries.forEach(function(e){delete e._new});
  }

  /* ----- konfeti pixel ----- */
  function confetti(){
    if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches)return;
    var c=$("fx"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
    var cols=["#FF5FA2","#FFE66D","#8DF0CE","#7CC4FF","#B79CFF"],ps=[];
    for(var i=0;i<90;i++)ps.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:8+Math.floor(Math.random()*3)*4,c:cols[i%5]});
    var t0=performance.now();
    (function f(t){
      x.clearRect(0,0,c.width,c.height);
      ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;x.fillStyle=p.c;x.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s)});
      if(t-t0<3500)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);
    })(t0);
  }

  /* ----- surat ----- */
  function openLetter(e,hold){
    clearTimeout(timer); showing=true;
    var p=photo(e),c=pal(e),ic=icon(e),i=Math.max(idx(e),0);
    var pic=p?'<div class="pic"><img alt="Foto dari '+esc(e.name)+'" src="'+p+'"></div>':'<div class="pic icon" style="--c:'+c[0]+'"><div class="ico">'+px(ic)+'</div></div>';
    var st=[["left:-3vmin;top:-3vmin","-12deg","bob"],["right:-3vmin;top:-3vmin","14deg","bob2"],["left:-3vmin;bottom:-3vmin","-8deg","bob2"],["right:-3vmin;bottom:-3vmin","10deg","bob"]].map(function(s,k){
      return '<div class="stk '+s[2]+'" style="'+s[0]+';--r:'+s[1]+'">'+px(STK[(i*3+k*4+1)%STK.length])+'</div>'}).join("");
    $("ov").className="on";
    $("ov").innerHTML='<div class="ovtools"><button id="oPrev" aria-label="Sebelumnya">‹</button><button id="oNext" aria-label="Berikutnya">›</button><button id="oDel">Hapus</button><button id="oClose">Tutup</button></div>'+
      '<div class="stage">'+envSvg+'<div class="letter'+(p?'':' nopic')+'">'+st+pic+
      '<div class="rt"><div class="who">Dari '+esc(e.name)+'</div><div class="msg">'+esc(e.message)+'</div></div></div></div>';
    $("oClose").onclick=closeLetter;
    $("oPrev").onclick=function(){step(-1,e)}; $("oNext").onclick=function(){step(1,e)};
    $("oDel").onclick=function(){askDelete(e)};
    $("ov").onclick=function(ev){if(ev.target.id==="ov")closeLetter()};
    setTimeout(confetti,900);
    if(hold)timer=setTimeout(closeLetter,hold);
  }
  function step(d,e){var n=entries[(idx(e)+d+entries.length)%entries.length]; if(n)openLetter(n,0)}
  function closeLetter(){clearTimeout(timer);$("ov").className="";$("ov").innerHTML="";showing=false;next()}
  function next(){
    if(showing)return;
    if(queue.length){openLetter(queue.shift(),HOLD);return}
    if(auto&&entries.length){timer=setTimeout(function(){
      if(showing)return; autoIdx=(autoIdx+1)%entries.length; openLetter(entries[entries.length-1-autoIdx],HOLD)},1500)}
  }
  function askDelete(e){
    var t=document.querySelector(".ovtools"); clearTimeout(timer);
    t.innerHTML='<div class="pin"><input type="password" id="pinIn" placeholder="PIN admin" aria-label="PIN admin"><button id="pinOk">Hapus</button><button id="pinNo">Batal</button></div>';
    $("pinIn").focus();
    $("pinNo").onclick=function(){openLetter(e,0)};
    $("pinOk").onclick=async function(){
      var r=await fetch("/api/hapus",{method:"POST",headers:{"content-type":"application/json","x-pin":$("pinIn").value},body:JSON.stringify({id:e.id})});
      var j=await r.json().catch(function(){return{}});
      if(!r.ok){toast(j.error||"Gagal menghapus");openLetter(e,0);return}
      entries=entries.filter(function(x){return x.id!==e.id});delete known[e.id];render();closeLetter();toast("Dihapus");
    };
  }
  $("grid").addEventListener("click",function(ev){
    var b=ev.target.closest(".card");if(!b)return;
    var e=entries.find(function(x){return x.id===b.getAttribute("data-id")});if(e){queue=[];openLetter(e,0)}
  });

  /* ----- QR besar ----- */
  var qrBuilt=false;
  function openQr(){
    if(!window.QRCode)return;
    var size=Math.round(Math.min(innerWidth,innerHeight)*0.58);
    $("qrBigBox").innerHTML="";
    try{new QRCode($("qrBigBox"),{text:location.origin+"/",width:size,height:size,correctLevel:QRCode.CorrectLevel.M})}catch(x){return}
    $("qrUrl").textContent=location.host;
    $("qrOv").className="on";
  }
  function closeQr(){$("qrOv").className=""}
  $("qr").onclick=openQr;
  $("qrOv").onclick=closeQr;

  document.addEventListener("keydown",function(ev){
    if(ev.key==="Escape"){if($("qrOv").className==="on")closeQr();else if(showing&&ev.target.id!=="pinIn")closeLetter()}
  });

  /* ----- polling ----- */
  async function poll(){
    try{
      var r=await fetch("/api/daftar?after="+encodeURIComponent(afterKey),{cache:"no-store"});
      var j=await r.json(), changed=false, alive={};
      j.ids.forEach(function(i){alive[i]=1});
      var before=entries.length;
      entries=entries.filter(function(e){return alive[e.id]});
      if(entries.length!==before)changed=true;
      j.entries.forEach(function(e){
        if(known[e.id])return; known[e.id]=1; changed=true;
        if(!first){e._new=true;queue.push(e)}
        entries.push(e);
      });
      entries.sort(function(a,b){return a.id<b.id?-1:1});
      if(j.ids.length)afterKey=j.ids[j.ids.length-1];
      if(changed||first)render();
      first=false; if(!showing)next();
    }catch(x){}
    setTimeout(poll,3000);
  }

  /* ----- tombol ----- */
  $("bAuto").onclick=function(){auto=!auto;this.setAttribute("aria-pressed",auto);try{localStorage.setItem("auto",auto?"1":"0")}catch(x){}if(auto&&!showing)next()};
  $("bFull").onclick=function(){var d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else if(d.requestFullscreen)d.requestFullscreen().catch(function(){toast("Layar penuh tidak didukung browser ini")})};
  $("bAlbum").onclick=async function(){
    var b=this;b.disabled=true;var o=b.textContent;
    try{
      var out=[];
      for(var i=0;i<entries.length;i++){
        b.textContent="Menyiapkan "+(i+1)+"/"+entries.length;var e=entries[i],img="",c=PAL[i%PAL.length];
        if(e.hasPhoto){var r=await fetch(photo(e));var bl=await r.blob();img=await new Promise(function(res){var f=new FileReader();f.onload=function(){res(f.result)};f.readAsDataURL(bl)})}
        out.push('<article style="background:'+c[0]+';box-shadow:5px 5px 0 '+c[1]+'"><h2>Dari '+esc(e.name)+'</h2>'+(img?'<img src="'+img+'" alt="">':'')+'<p>'+esc(e.message)+'</p></article>');
      }
      var t=esc(TEKS.judul1+" x "+TEKS.judul2+" "+TEKS.versi+" - "+TEKS.sub);
      var html='<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+t+'</title><style>body{font-family:system-ui,sans-serif;max-width:680px;margin:0 auto;padding:24px 16px;color:#3B2342;background:#FFD1E6}h1{text-align:center;color:#4A2F9E}article{border:3px solid #4A2F9E;border-radius:20px;padding:18px;margin:22px 0;break-inside:avoid}h2{margin:0 0 10px;font-size:20px;text-align:center}img{display:block;max-width:100%;margin:0 auto 12px;border-radius:12px;border:4px solid #fff}p{white-space:pre-wrap;line-height:1.6;text-align:center;margin:0;font-weight:600}</style><h1>'+t+'</h1>'+out.join("")+'</html>';
      var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));a.download="album-kenangan.html";document.body.appendChild(a);a.click();a.remove();
    }catch(x){toast("Gagal menyiapkan album")}
    b.disabled=false;b.textContent=o;
  };
  try{ if(window.QRCode){$("qr").hidden=false;new QRCode($("qrbox"),{text:location.origin+"/",width:140,height:140,correctLevel:QRCode.CorrectLevel.M})} }catch(x){}
  render();poll();
})();
</script>
</body>
</html>
